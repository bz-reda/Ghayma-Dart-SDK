name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ghayma-dart-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Spec is in sync with the published contract
        run: |
          tool/sync_spec.sh
          git diff --exit-code spec/

  conformance:
    runs-on: ghayma-dart-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dart pub get
      - run: tool/conformance.sh
