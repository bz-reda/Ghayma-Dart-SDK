  /v1/{appSlug}/auth/google:
    parameters:
      - $ref: '#/components/parameters/appSlug'
    get:
      tags: [OAuth]
      operationId: startGoogleOAuth
      summary: Start Google sign-in.
      description: |
        Redirects the browser to Google. The provider must be enabled for the app and
        `redirect_uri` must match one of the app's allowed origins. The service comes
        back to GET /callback/google and from there to `redirect_uri`.
      parameters:
        - name: redirect_uri
          in: query
          required: true
          description: Where to send the browser once sign-in finishes. Must match an allowed origin of the app.
          schema:
            type: string
            example: https://app.example.com/auth/callback
        - name: code_challenge
          in: query
          required: false
          description: |
            PKCE challenge, base64url(sha256(verifier)). When present the redirect
            carries a one-time `code` query parameter instead of tokens in the
            fragment; spend it at POST /oauth/exchange.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._~-]{43,128}$'
        - name: code_challenge_method
          in: query
          required: false
          description: Only S256. Defaults to S256 when a challenge is present.
          schema:
            type: string
            enum: [S256]
      responses:
        '307':
          description: Redirect to Google's consent screen.
          headers:
            Location:
              description: The provider's authorization URL, carrying the app's client id and a single-use state.
              schema:
                type: string
              example: https://accounts.google.com/o/oauth2/v2/auth?client_id=...&state=...
        '400':
          description: The provider is off for this app, unconfigured, or `redirect_uri` is missing or not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    error: redirect_uri not in allowed origins
                disabled:
                  value:
                    error: Google sign-in is disabled for this app
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{appSlug}/auth/github:
    parameters:
      - $ref: '#/components/parameters/appSlug'
    get:
      tags: [OAuth]
      operationId: startGitHubOAuth
      summary: Start GitHub sign-in.
      description: |
        Same shape as Google sign-in. The provider must be enabled for the app and
        `redirect_uri` must match one of the app's allowed origins.
      parameters:
        - name: redirect_uri
          in: query
          required: true
          description: Where to send the browser once sign-in finishes. Must match an allowed origin of the app.
          schema:
            type: string
            example: https://app.example.com/auth/callback
        - name: code_challenge
          in: query
          required: false
          description: |
            PKCE challenge, base64url(sha256(verifier)). When present the redirect
            carries a one-time `code` query parameter instead of tokens in the
            fragment; spend it at POST /oauth/exchange.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._~-]{43,128}$'
        - name: code_challenge_method
          in: query
          required: false
          description: Only S256. Defaults to S256 when a challenge is present.
          schema:
            type: string
            enum: [S256]
      responses:
        '307':
          description: Redirect to GitHub's consent screen.
          headers:
            Location:
              description: The provider's authorization URL, carrying the app's client id and a single-use state.
              schema:
                type: string
              example: https://github.com/login/oauth/authorize?client_id=...&state=...
        '400':
          description: The provider is off for this app, unconfigured, or `redirect_uri` is missing or not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    error: redirect_uri not in allowed origins
                disabled:
                  value:
                    error: GitHub sign-in is disabled for this app
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{appSlug}/callback/google:
    parameters:
      - $ref: '#/components/parameters/appSlug'
    get:
      tags: [Browser flows]
      operationId: googleOAuthCallback
      summary: Provider callback for Google sign-in.
      description: |
        Called by Google, never by an app. Upserts the user and redirects to the
        `redirect_uri` the flow started with, carrying the session in the URL
        fragment (`#access_token=…&refresh_token=…&expires_in=…&token_type=Bearer`).
        Failures redirect to the same URI with `#error=…`. Once the mobile OAuth
        change ships, a flow started with a `code_challenge` instead receives a
        one-time `?code=…` query parameter and no tokens.
      x-internal: true
      parameters:
        - name: code
          in: query
          required: true
          description: The provider's authorization code.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: The single-use state minted at GET /auth/google.
          schema:
            type: string
      responses:
        '307':
          description: Redirect back to the app.
          headers:
            Location:
              description: The app's redirect_uri with the session in the fragment, or with an error.
              schema:
                type: string
              example: https://app.example.com/auth/callback#access_token=eyJ...&refresh_token=9f8e...&expires_in=900&token_type=Bearer
        '400':
          description: The provider reported an error, the state is unknown or expired, or the provider is off for this app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_grant:
                  value:
                    error: invalid or expired OAuth state — please try again
                invalid_request:
                  value:
                    error: missing code or state parameter
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{appSlug}/callback/github:
    parameters:
      - $ref: '#/components/parameters/appSlug'
    get:
      tags: [Browser flows]
      operationId: githubOAuthCallback
      summary: Provider callback for GitHub sign-in.
      description: |
        Called by GitHub, never by an app. Same redirect contract as the Google
        callback, including the fragment shape and the `#error=…` failure path.
      x-internal: true
      parameters:
        - name: code
          in: query
          required: true
          description: The provider's authorization code.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: The single-use state minted at GET /auth/github.
          schema:
            type: string
      responses:
        '307':
          description: Redirect back to the app.
          headers:
            Location:
              description: The app's redirect_uri with the session in the fragment, or with an error.
              schema:
                type: string
              example: https://app.example.com/auth/callback#access_token=eyJ...&refresh_token=9f8e...&expires_in=900&token_type=Bearer
        '400':
          description: The provider reported an error, the state is unknown or expired, or the provider is off for this app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_grant:
                  value:
                    error: invalid or expired OAuth state — please try again
                invalid_request:
                  value:
                    error: missing code or state parameter
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{appSlug}/oauth/exchange:
    parameters:
      - $ref: '#/components/parameters/appSlug'
    post:
      tags: [OAuth]
      operationId: exchangeOAuthCode
      summary: Exchange a PKCE one-time code for a session.
      description: |
        The mobile half of OAuth: a redirect started with a `code_challenge` hands the
        app a one-time `code` (120 s, single use) instead of tokens, so no token ever
        travels through the OS URL handler. The code is bound to the challenge and to
        this app.
      parameters:
        - $ref: '#/components/parameters/serverKey'
        - $ref: '#/components/parameters/clientIP'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchangeRequest'
            example:
              code: 6d3b17f0c94a...
              code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
      responses:
        '200':
          description: The same body as a successful login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                success:
                  value:
                    access_token: eyJhbGciOiJSUzI1NiIsImtpZCI6Im15LWFwcC12MSJ9...
                    refresh_token: 9f8e7d6c5b4a...
                    expires_in: 900
                    token_type: Bearer
                    user:
                      id: 3f7c2b90-5e1a-4f2b-9c3d-8a1b2c3d4e5f
                      email: user@example.com
                      name: Sample User
                      email_verified: true
                      provider: google
                      totp_enabled: false
                      whatsapp_otp_enabled: false
                      recovery_codes_left: 0
                      created_at: '2026-09-01T10:15:00Z'
                      last_login_at: '2026-09-09T08:30:00Z'
        '400':
          description: Malformed body, or a code that is unknown, expired, already spent, for another app, or does not match the verifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    error: code and code_verifier required
                    code: invalid_request
                invalid_grant:
                  value:
                    error: invalid or expired code
                    code: invalid_grant
        '403':
          description: The account behind the code is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                disabled:
                  value:
                    error: Account is disabled
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{appSlug}/oauth/id-token:
    parameters:
      - $ref: '#/components/parameters/appSlug'
    post:
      tags: [OAuth]
      operationId: signInWithIdToken
      summary: Sign in with a provider ID token obtained natively.
      description: |
        For native sign-in on iOS and Android, where the platform hands the app an ID
        token and no browser is involved. The token is verified against the provider's
        JWKS and against the app's registered client ids — its web client id plus the
        native client ids configured in the console. `nonce`, when sent, must match the
        token's claim.
      parameters:
        - $ref: '#/components/parameters/serverKey'
        - $ref: '#/components/parameters/clientIP'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthIDTokenRequest'
            example:
              provider: google
              id_token: eyJhbGciOiJSUzI1NiIsImtpZCI6IjFhMmIzYyJ9...
              nonce: 7f3a1c9e0b52
      responses:
        '200':
          description: The same body as a successful login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                success:
                  value:
                    access_token: eyJhbGciOiJSUzI1NiIsImtpZCI6Im15LWFwcC12MSJ9...
                    refresh_token: 9f8e7d6c5b4a...
                    expires_in: 900
                    token_type: Bearer
                    user:
                      id: 3f7c2b90-5e1a-4f2b-9c3d-8a1b2c3d4e5f
                      email: user@example.com
                      name: Sample User
                      email_verified: true
                      provider: google
                      totp_enabled: false
                      whatsapp_otp_enabled: false
                      recovery_codes_left: 0
                      created_at: '2026-09-01T10:15:00Z'
                      last_login_at: '2026-09-09T08:30:00Z'
        '400':
          description: Unsupported provider, a provider that is off for this app, or a token with no email claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    error: unsupported provider
                    code: invalid_request
                disabled:
                  value:
                    error: Google sign-in is disabled for this app
        '401':
          description: The ID token failed verification. The reason is logged, never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_token:
                  value:
                    error: invalid id token
                    code: invalid_token
        '403':
          description: The app is at the user cap of its capacity bracket, or the account is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    error: User limit reached for this application
                disabled:
                  value:
                    error: Account is disabled
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{appSlug}/.well-known/jwks.json:
    parameters:
      - $ref: '#/components/parameters/appSlug'
    get:
      tags: [Keys]
      operationId: jwks
      summary: Public signing keys of this app.
      description: |
        Verify access tokens against this set. The `kid` carries the app's key
        generation, so a rotation changes it and a cached key set misses — which is
        the signal every JWKS client uses to re-fetch.
      responses:
        '200':
          description: The app's current public key.
          headers:
            Cache-Control:
              description: Public, one hour.
              schema:
                type: string
              example: public, max-age=3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'
              examples:
                success:
                  value:
                    keys:
                      - kty: RSA
                        kid: my-app-v1
                        use: sig
                        alg: RS256
                        n: sXchDaQebHnPiGvyDOAT4saGEUetSyo9MKLOoWFsueri23bOdgWp4Dy1Wl...
                        e: AQAB
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    appSlug:
      name: appSlug
      in: path
      required: true
      description: Auth app slug (`app_id`).
      schema:
        type: string
        example: my-app
    serverKey:
      name: X-Ghayma-Server-Key
      in: header
      required: false
      description: Per-app server key; must be sent together with X-Ghayma-Client-IP.
      schema:
        type: string
    clientIP:
      name: X-Ghayma-Client-IP
      in: header
      required: false
      description: Real end-user IP forwarded by a trusted server; honoured only with a valid server key.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RetryAfter:
      description: Seconds until the tripped limit resets.
      schema:
        type: integer
  responses:
    RateLimited:
      description: Too many requests for this client or app.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rate_limited:
              value:
                error: too many requests, please try again later
                code: rate_limited
    NotFound:
      description: Unknown app slug.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_found:
              value:
                error: auth app not found
    Unauthorized:
      description: |
        No usable access token. The message names the reason: a missing or malformed
        `Authorization` header, an expired or unverifiable token, claims without a
        subject, or a user that no longer exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                error: missing or invalid Authorization header
    AccountDisabled:
      description: The token is valid but the account has been disabled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            disabled:
              value:
                error: account is disabled
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable reason, present on newer endpoints.
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    User:
      type: object
      description: An end user of the auth app, as the service renders it.
      required:
        - id
        - email
        - name
        - email_verified
        - provider
        - totp_enabled
        - whatsapp_otp_enabled
        - recovery_codes_left
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          description: Empty string when the account has no name.
        avatar_url:
          type: string
          description: Omitted when empty.
        email_verified:
          type: boolean
        provider:
          type: string
          enum: [email, google, github]
        metadata:
          type: object
          additionalProperties: true
          description: |
            User-owned bag. Accepted by PATCH /me and carried in the access token as
            the `user_metadata` claim, but never rendered in this object — read it
            from the token.
        app_metadata:
          type: object
          additionalProperties: true
          description: |
            Developer-owned bag (roles, plan, tenant id) written from the management
            plane and embedded in the access token. Omitted when empty.
        totp_enabled:
          type: boolean
        whatsapp_otp_enabled:
          type: boolean
          description: Always false — the WhatsApp factor is not offered.
        recovery_codes_left:
          type: integer
          description: How many single-use recovery codes are still unspent.
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          description: Omitted until the first successful sign-in.
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, token_type]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Access-token lifetime in seconds }
        token_type: { type: string, example: Bearer }
    Session:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    PendingVerification:
      type: object
      description: Registration answer when the app requires a verified email; no tokens are issued.
      required: [message, user]
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'
    TwoFARequired:
      type: object
      description: The password verified but the user holds a second factor.
      required: [two_fa_required, challenge_token, methods, phone_hint]
      properties:
        two_fa_required:
          type: boolean
          enum: [true]
        challenge_token:
          type: string
          description: Single-use, expiring; spend it at POST /2fa/verify.
        methods:
          type: array
          items:
            type: string
            enum: [totp, whatsapp]
        phone_hint:
          type: string
          description: Masked phone for the WhatsApp factor; empty string when there is none.
    TwoFAEnrollmentRequired:
      type: object
      description: The app enforces 2FA and this user is not enrolled yet.
      required: [two_fa_enrollment_required, enroll_token, methods]
      properties:
        two_fa_enrollment_required:
          type: boolean
          enum: [true]
        enroll_token:
          type: string
          description: Authorises enrolment only; spend it at POST /2fa/totp/enroll and /2fa/totp/confirm.
        methods:
          type: array
          items:
            type: string
            enum: [totp, whatsapp]
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    UpdateMeRequest:
      type: object
      description: Send only the fields to change; at least one is required.
      properties:
        name:
          type: string
          maxLength: 100
        avatar_url:
          type: string
          maxLength: 500
        metadata:
          type: object
          additionalProperties: true
    DeleteMeRequest:
      type: object
      description: Required for email accounts; OAuth accounts send an empty body.
      properties:
        password:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 128
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
    VerifyResetTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ResetTokenValidity:
      type: object
      required: [valid, email]
      properties:
        valid:
          type: boolean
          enum: [true]
        email:
          type: string
          format: email
          description: The address the reset link belongs to, for display on a custom page.
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    RequestEmailChangeRequest:
      type: object
      required: [new_email, current_password]
      properties:
        new_email:
          type: string
          format: email
        current_password:
          type: string
    EmailChangeResponse:
      type: object
      required: [message, expires_at]
      properties:
        message:
          type: string
        expires_at:
          type: string
          format: date-time
          description: When the confirmation link stops working (one hour after the request).
    TwoFAVerifyRequest:
      type: object
      required: [challenge_token, code]
      properties:
        challenge_token:
          type: string
        code:
          type: string
          description: A TOTP code or one of the recovery codes.
    TotpEnrollRequest:
      type: object
      description: Send `enroll_token` when enrolling from an enforced login; omit it when a bearer token is present.
      properties:
        enroll_token:
          type: string
    TotpEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
          description: Base32 secret to type into an authenticator by hand.
        otpauth_uri:
          type: string
          description: The same secret as an otpauth:// URI, to render as a QR code.
    TotpConfirmRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
        enroll_token:
          type: string
    TotpConfirmation:
      type: object
      description: |
        `recovery_codes` is present only when a set was minted (first enrolment, or a
        re-enrolment after disable). The session fields are present only on the
        enforced-enrolment path, which completes the login here.
      required: [enabled]
      properties:
        enabled:
          type: boolean
          enum: [true]
        recovery_codes:
          type: array
          items:
            type: string
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
        token_type: { type: string }
        user:
          $ref: '#/components/schemas/User'
    TwoFAPasswordCodeRequest:
      type: object
      required: [password, code]
      properties:
        password:
          type: string
        code:
          type: string
          description: A TOTP code or one of the recovery codes.
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    OAuthExchangeRequest:
      type: object
      required: [code, code_verifier]
      properties:
        code:
          type: string
          description: The one-time code the redirect carried.
        code_verifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: The verifier the challenge was derived from.
    OAuthIDTokenRequest:
      type: object
      required: [provider, id_token]
      properties:
        provider:
          type: string
          enum: [google]
          description: Apple joins this list once the platform supports it.
        id_token:
          type: string
        nonce:
          type: string
          description: When present, must equal the token's nonce claim.
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JWK'
    JWK:
      type: object
      required: [kty, kid, use, alg, n, e]
      properties:
        kty: { type: string, enum: [RSA] }
        kid: { type: string, description: '`<app slug>-v<key version>`.' }
        use: { type: string, enum: [sig] }
        alg: { type: string, enum: [RS256] }
        n: { type: string, description: 'Modulus, base64url.' }
        e: { type: string, description: 'Exponent, base64url.' }
