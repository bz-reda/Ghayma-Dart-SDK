                    error: 2FA is not enabled
        '401':
          description: Wrong password or wrong code (one message for both), or no valid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_credentials:
                  value:
                    error: invalid password or code
                unauthorized:
                  value:
                    error: missing or invalid Authorization header
        '403':
